name: Production Early Access Deploy


on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'none'
        type: choice
        options:
        - 'none'
        - 'register-gemini'

jobs:
  register-gemini:
    if: github.event.inputs.action == 'register-gemini'
    name: Register Gemini Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Register Gemini Provider
        run: node scripts/wire-ai-orchestration.mjs "$ADMIN_USER_ID" "$ADMIN_EMAIL" "$ADMIN_FULL_NAME"
        env:
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ensure other required DB/Context secrets are present
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}

  verify:
    name: Production verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run production:verify
        env:
          NODE_ENV: production
          AAOS_DEPLOY_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run go-live:verify
        env:
          NODE_ENV: production
          AAOS_DEPLOY_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  build-and-deploy:
    name: Build and Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify Secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN missing"; exit 1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID missing"; exit 1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID missing"; exit 1; fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Run Authentication Diagnostic
        run: node scripts/debug-vercel-auth.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Trigger Vercel Deployment via API
        run: |
          curl -X POST https://api.vercel.com/v13/deployments \
          -H "Authorization: Bearer $VERCEL_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "arjunautomationos-enterprise",
            "project": "'$VERCEL_PROJECT_ID'",
            "target": "production",
            "gitSource": {
              "type": "github",
              "repoId": "1325528606",
              "ref": "main"
            }
          }'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  healthcheck:
    name: Post-deploy health checks
    needs: build-and-deploy
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Probe production endpoints
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_BASE_URL:-}" ]; then
            echo "PRODUCTION_BASE_URL not set — skipping live probe (configure repo variable)."
            exit 0
          fi
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/live" | tee live.json
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/ready" | tee ready.json || true
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/health" | tee health.json || true
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/production" | tee production.json || true
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/go-live" | tee go-live.json || true
          echo "Health probes complete"

  rollback_notes:
    name: Publish rollback strategy
    needs: [verify, build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echo rollback strategy
        run: |
          echo "Rollback strategy:"
          echo "1. Redeploy previous git tag / immutable artifact"
          echo "2. Re-run npm run production:verify"
          echo "3. Confirm /api/ops/live and /api/ops/ready"
          echo "4. See docs/DEPLOYMENT_CHECKLIST.md and docs/INCIDENT_RESPONSE.md"
