# Local-first policy: this workflow NEVER runs automatically. Manual
# `workflow_dispatch` with an explicit action is the only trigger, and the
# default action is `none` (no-op). Vercel credentials are required ONLY inside
# the explicit `deploy-production` path — never for local build/tests/startup.
name: Production Early Access Deploy


on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'none'
        type: choice
        options:
        - 'none'
        - 'register-gemini'
        - 'deploy-production'

jobs:
  register-gemini:
    if: github.event.inputs.action == 'register-gemini'
    name: Register Gemini Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate admin secrets (fail closed)
        run: |
          set -euo pipefail
          missing=0
          for v in ADMIN_USER_ID ADMIN_EMAIL ADMIN_FULL_NAME; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v secret is not set; register-gemini cannot run with an empty admin identity."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to run register-gemini without the required ADMIN_* secrets." >&2
            exit 1
          fi
        env:
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
          cache: npm
      - run: npm ci
      - name: Register Gemini Provider
        run: node scripts/wire-ai-orchestration.mjs "$ADMIN_USER_ID" "$ADMIN_EMAIL" "$ADMIN_FULL_NAME"
        env:
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ensure other required DB/Context secrets are present
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}

  verify:
    if: github.event.inputs.action == 'deploy-production'
    name: Production verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
          cache: npm
      - run: npm ci
      - run: npm run production:verify
        env:
          NODE_ENV: production
          AAOS_DEPLOY_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}
          # NOTE: GEMINI_API_KEY intentionally absent — general production
          # verification must pass without any AI credentials (local fallback).
      - run: npm run go-live:verify
        env:
          NODE_ENV: production
          AAOS_DEPLOY_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLATFORM_LEAD_API_KEY: ${{ secrets.PLATFORM_LEAD_API_KEY }}
          PLATFORM_ORGANIZATION_ID: ${{ secrets.PLATFORM_ORGANIZATION_ID }}
          # NOTE: GEMINI_API_KEY intentionally absent here as well.

  build-and-deploy:
    if: github.event.inputs.action == 'deploy-production'
    name: Build and Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    # GitHub production environment approval boundary.
    # NOTE: YAML alone is insufficient — a required-reviewer protection rule for
    # the `Production` environment MUST be configured in GitHub Settings >
    # Environments > Production (required reviewers). On this repository the
    # account plan does NOT support environment protection rules (HTTP 422:
    # "Please ensure the billing plan supports the required reviewers protection
    # rule"), so the gate currently relies on `workflow_dispatch` write access.
    # See docs/PRODUCTION_RECOVERY_RUNBOOK.md §2.
    environment: production
    steps:
      # Fail closed BEFORE any build/deploy if production configuration is
      # incomplete. Previously a missing PRODUCTION_BASE_URL only failed at the
      # post-deploy healthcheck, leaving a live deployment unverified.
      - name: Preflight — production configuration gate
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PRODUCTION_BASE_URL:-}" ]; then
            echo "::error::PRODUCTION_BASE_URL repo variable is required for production health checks (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then echo "::error::VERCEL_TOKEN secret is required."; missing=1; fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then echo "::error::VERCEL_PROJECT_ID secret is required."; missing=1; fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then echo "::error::VERCEL_ORG_ID secret is required."; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Production preflight failed; refusing to deploy." >&2
            exit 1
          fi
          echo "Preflight passed: production configuration present."
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
          cache: npm
      - run: npm ci
      - name: Trigger Vercel Deployment via API
        run: |
          set -euo pipefail
          TMP_PAYLOAD="$(mktemp)"
          cat > "$TMP_PAYLOAD" <<EOF
          {
            "name": "arjunautomationos-enterprise",
            "project": "$VERCEL_PROJECT_ID",
            "target": "production",
            "gitSource": {
              "type": "github",
              "repoId": "1325528606",
              "ref": "main"
            }
          }
          EOF
          # -f makes HTTP >= 400 fail the step; -S shows errors without printing secrets.
          curl -fsS -X POST https://api.vercel.com/v13/deployments \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data @"$TMP_PAYLOAD" > deployment.json
          rm -f "$TMP_PAYLOAD"
          DEPLOYMENT_ID="$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).id || ''")"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Deployment creation failed: no deployment id returned" >&2
            cat deployment.json >&2
            exit 1
          fi
          echo "Deployment created: $DEPLOYMENT_ID"
          # Poll until Vercel reports READY; fail on ERROR/CANCELED or timeout.
          ATTEMPTS=30
          for i in $(seq 1 "$ATTEMPTS"); do
            if [ -n "${VERCEL_ORG_ID:-}" ]; then
              curl -fsS \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" > deployment-status.json
            else
              curl -fsS \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}" > deployment-status.json
            fi
            STATUS="$(node -p "JSON.parse(require('fs').readFileSync('deployment-status.json','utf8')).status || ''")"
            echo "Attempt ${i}/${ATTEMPTS}: status=${STATUS}"
            case "$STATUS" in
              READY)
                echo "Deployment $DEPLOYMENT_ID is READY"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "Deployment $DEPLOYMENT_ID failed with status=${STATUS}" >&2
                cat deployment-status.json >&2
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for deployment $DEPLOYMENT_ID to become READY" >&2
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  healthcheck:
    if: github.event.inputs.action == 'deploy-production'
    name: Post-deploy health checks
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Probe production endpoints
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_BASE_URL:-}" ]; then
            echo "PRODUCTION_BASE_URL repo variable is required for production health checks; refusing to silently skip." >&2
            exit 1
          fi
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/live" | tee live.json
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/ready" | tee ready.json
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/health" | tee health.json
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/production" | tee production.json
          curl -fsS "$PRODUCTION_BASE_URL/api/ops/go-live" | tee go-live.json
          echo "Health probes complete"

  rollback_notes:
    if: github.event.inputs.action == 'deploy-production'
    name: Publish rollback strategy
    needs: [verify, build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echo rollback strategy
        run: |
          echo "Rollback strategy:"
          echo "1. Redeploy previous git tag / immutable artifact"
          echo "2. Re-run npm run production:verify"
          echo "3. Confirm /api/ops/live and /api/ops/ready"
          echo "4. See docs/DEPLOYMENT_CHECKLIST.md and docs/INCIDENT_RESPONSE.md"
