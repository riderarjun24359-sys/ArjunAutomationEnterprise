name: Cloudflare Apex Proxy Canary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-apex-proxy-canary
  cancel-in-progress: false

jobs:
  enable-apex-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enable Cloudflare proxy for apex with automatic rollback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          API="https://api.cloudflare.com/client/v4"
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_file="$(mktemp)"
          dns_file="$(mktemp)"
          routes_file="$(mktemp)"
          ssl_file="$(mktemp)"
          health_file="$(mktemp)"
          updates_dir="$(mktemp -d)"
          trap 'rm -f "$zone_file" "$dns_file" "$routes_file" "$ssl_file" "$health_file"; rm -rf "$updates_dir"' EXIT

          code="$(curl -sS -o "$zone_file" -w '%{http_code}' "$API/zones?name=arjunautomations.com&per_page=50" "${headers[@]}")"
          [ "$code" = "200" ] || { echo "::error::Cannot read Cloudflare zone (HTTP $code)."; exit 1; }
          zone_id="$(python3 - "$zone_file" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          z=next((x for x in d.get("result",[]) if x.get("name")=="arjunautomations.com"),None)
          print(z.get("id","") if z else "")
          PY
          )"
          [ -n "$zone_id" ] || { echo "::error::Zone not found."; exit 1; }

          code="$(curl -sS -o "$routes_file" -w '%{http_code}' "$API/zones/$zone_id/workers/routes" "${headers[@]}")"
          [ "$code" = "200" ] || { echo "::error::Cannot verify Worker routes (HTTP $code)."; exit 1; }
          python3 - "$routes_file" <<'PY'
          import json,sys
          routes=json.load(open(sys.argv[1])).get("result",[])
          ok=any(r.get("pattern")=="arjunautomations.com/*" and r.get("script")=="arjunautomationenterprise" for r in routes)
          if not ok:
              print("Expected apex Worker route is not installed.")
              sys.exit(1)
          print("Expected apex Worker route verified.")
          PY

          code="$(curl -sS -o "$ssl_file" -w '%{http_code}' "$API/zones/$zone_id/settings/ssl" "${headers[@]}")"
          [ "$code" = "200" ] || { echo "::error::Cannot verify SSL mode (HTTP $code)."; exit 1; }
          ssl_mode="$(python3 - "$ssl_file" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1])).get("result",{}).get("value","unknown"))
          PY
          )"
          case "$ssl_mode" in full|strict) echo "SSL mode verified: $ssl_mode";; *) echo "::error::Unsafe or unknown SSL mode: $ssl_mode"; exit 1;; esac

          code="$(curl -sS -o "$dns_file" -w '%{http_code}' "$API/zones/$zone_id/dns_records?name=arjunautomations.com&type=A&per_page=20" "${headers[@]}")"
          [ "$code" = "200" ] || { echo "::error::Cannot read apex A records (HTTP $code)."; exit 1; }
          count="$(python3 - "$dns_file" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1])).get("result",[])))
          PY
          )"
          [ "$count" = "2" ] || { echo "::error::Expected exactly two apex A records; found $count. No changes made."; exit 1; }

          python3 - "$dns_file" "$updates_dir" <<'PY'
          import json,os,sys
          records=json.load(open(sys.argv[1])).get("result",[])
          for i,r in enumerate(records):
              if r.get("name")!="arjunautomations.com" or r.get("type")!="A":
                  raise SystemExit("Unexpected apex record returned; aborting.")
              if r.get("proxied"):
                  raise SystemExit("An apex A record is already proxied; manual review required.")
              data={"type":"A","name":r["name"],"content":r["content"],"ttl":r.get("ttl",1),"proxied":True}
              with open(os.path.join(sys.argv[2],f"{i}.json"),"w") as f: json.dump(data,f)
              with open(os.path.join(sys.argv[2],f"{i}.id"),"w") as f: f.write(r["id"])
          PY

          changed=()
          rollback() {
            echo "Restoring original DNS-only status for changed apex A records."
            for id in "${changed[@]}"; do
              idx="${id##*:}"
              record_id="${id%:*}"
              python3 - "$updates_dir/$idx.json" "$updates_dir/$idx.restore.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); d["proxied"]=False
          json.dump(d,open(sys.argv[2],"w"))
          PY
              curl -sS -X PUT "$API/zones/$zone_id/dns_records/$record_id" "${headers[@]}" --data-binary @"$updates_dir/$idx.restore.json" -o /dev/null || true
            done
          }

          for idx in 0 1; do
            record_id="$(cat "$updates_dir/$idx.id")"
            code="$(curl -sS -X PUT -o "$zone_file" -w '%{http_code}' "$API/zones/$zone_id/dns_records/$record_id" "${headers[@]}" --data-binary @"$updates_dir/$idx.json")"
            if [ "$code" != "200" ] || ! python3 - "$zone_file" <<'PY'
          import json,sys
          try: sys.exit(0 if json.load(open(sys.argv[1])).get("success") else 1)
          except Exception: sys.exit(1)
          PY
            then
              echo "::error::Failed to proxy apex A record $idx (HTTP $code)."
              rollback
              exit 1
            fi
            changed+=("$record_id:$idx")
          done

          echo "Both apex A records are proxied. Testing apex and final www destination."
          success=false
          for attempt in $(seq 1 8); do
            status="$(curl -k -sS -L --connect-timeout 5 --max-time 20 -o "$health_file" -w '%{http_code}' https://arjunautomations.com/ || true)"
            size="$(wc -c < "$health_file" 2>/dev/null || echo 0)"
            final_url="$(curl -k -sS -L --connect-timeout 5 --max-time 20 -o /dev/null -w '%{url_effective}' https://arjunautomations.com/ || true)"
            echo "Canary attempt $attempt: final HTTP $status, response bytes $size, final host ${final_url#https://}"
            if [ "$status" = "200" ] && [ "$size" -gt 1000 ]; then
              success=true
              break
            fi
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "::error::Apex health check failed."
            rollback
            exit 1
          fi

          echo "SUCCESS: apex is proxied through Cloudflare and resolves to a healthy HTTP 200 page."
          echo "Only the two apex A record proxy flags were changed. www and all email records were untouched."
