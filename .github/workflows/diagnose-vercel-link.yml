# TEMPORARY diagnostic (read-only): inspects the Vercel project's git connection
# and recent deployment origins to explain silent GitHub-App auto-deploys.
# Makes only GET requests; prints selected non-secret fields. Delete after use.
name: Diagnose Vercel Link (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Project link + recent deployments (read-only)
        run: |
          set -euo pipefail
          echo "--- project link ---"
          curl -fsS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq '{name, framework, link: {type: .link.type, repo: .link.repo, productionBranch: .link.productionBranch}}'
          echo "--- last 8 deployments (origin + sha) ---"
          curl -fsS "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=8" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq '.deployments[] | {state, url, gitSha: (.meta.githubCommitSha // "non-git"), created: .createdAt}'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
